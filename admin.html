<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reklama Norvex Admin</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <a href="index.html">Reklama Norvex Admin</a>
    </div>

    <div>
        <button id="logoutBtn">
            Çykış Yap
        </button>
    </div>

</header>

<section id="loginSection">

    <div class="admin-card">

        <h2>Admin Girişi</h2>

        <input
        type="email"
        id="email"
        placeholder="Admin Email">

        <input
        type="password"
        id="password"
        placeholder="Şifre">

        <button id="loginBtn">
            Giriş Yap
        </button>

    </div>

</section>

<section
id="adminPanel"
style="display:none;">

    <div class="admin-card">

        <h2>Yeni İlan Ekle</h2>

        <input
        type="text"
        id="title"
        placeholder="İlan Başlığı">

        <textarea
        id="description"
        placeholder="İlan Açıklaması"></textarea>

        <input
        type="number"
        id="price"
        placeholder="Fiyat">

        <label>Fotoğraf Seç</label>

        <select id="photo">

            <option value="">
                Fotoğraf Seç
            </option>

            <option value="images/1.jpg">Araba usta</option>
            <option value="images/2.jpg">Garson</option>
            <option value="images/3.jpg">Çoban</option>
            <option value="images/4.jpg">Lokanta</option>
            <option value="images/5.jpg">Otel</option>
            <option value="images/6.jpg">usta</option>
            <option value="images/7.jpg">Ýardımçı</option>
            <option value="images/8.jpg">Fotoğraf 8</option>
            <option value="images/9.jpg">Fotoğraf 9</option>
            <option value="images/10.jpg">Fotoğraf 10</option>

        </select>

        <input
        type="tel"
        id="phone"
        placeholder="Telefon Numarası">

        <input
        type="text"
        id="whatsapp"
        placeholder="WhatsApp Numarası">

        <input
        type="text"
        id="location"
        placeholder="Konum">

        <select id="gender">

            <option value="">
                Cinsiyet Seç
            </option>

            <option>Erkek</option>
            <option>Kadın</option>
            <option>Diğer</option>

        </select>

        <input
        type="number"
        id="age"
        placeholder="Yaş">

        <select id="category">

            <option>Yazılım İşleri</option>
            <option>Grafik Tasarım</option>
            <option>Web Tasarım</option>
            <option>Mobil Uygulama</option>
            <option>Dijital Pazarlama</option>
            <option>Muhasebe</option>
            <option>Eğitim</option>
            <option>Diğer</option>

        </select>

        <button id="addAdBtn">
            İlan Ekle
        </button>

    </div>

</section>

<section
id="adminAdsSection"
style="display:none;">

    <h2 style="text-align:center">
        Tüm İlanlar
    </h2>

    <div
    id="adminAds"
    class="ads-grid">
    </div>

</section>

<script
type="module"
src="admin.js">
</script>

</body>
</html>
