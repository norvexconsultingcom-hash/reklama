<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reklama Norvex Admin</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        Reklama Norvex Admin
    </div>

    <div>
        <button id="logoutBtn">
            Çıkış Yap
        </button>
    </div>

</header>

<!-- LOGIN -->

<section id="loginSection">

    <div class="admin-card">

        <h2>Admin Girişi</h2>

        <input
        type="email"
        id="email"
        placeholder="Admin Email">

        <input
        type="password"
        id="password"
        placeholder="Şifre">

        <button id="loginBtn">
            Giriş Yap
        </button>

    </div>

</section>

<!-- ADMIN PANEL -->

<section
id="adminPanel"
style="display:none;">

    <div class="admin-card">

        <h2>Yeni İlan Ekle</h2>

        <input
        type="text"
        id="title"
        placeholder="İlan Başlığı">

        <textarea
        id="description"
        placeholder="İlan Açıklaması">
        </textarea>

        <input
        type="number"
        id="price"
        placeholder="Fiyat">

        <input
        type="text"
        id="image"
        placeholder="Resim URL">

        <select id="category">

            <option>
                Yazılım İşleri
            </option>

            <option>
                Grafik Tasarım
            </option>

            <option>
                Web Tasarım
            </option>

            <option>
                Mobil Uygulama
            </option>

            <option>
                Dijital Pazarlama
            </option>

            <option>
                Muhasebe
            </option>

            <option>
                Eğitim
            </option>

            <option>
                Diğer
            </option>

        </select>

        <button id="addAdBtn">
            İlan Ekle
        </button>

    </div>

</section>

<!-- İLANLAR -->

<section
id="adminAdsSection"
style="display:none;">

    <h2 style="text-align:center">
        Tüm İlanlar
    </h2>

    <div
    id="adminAds"
    class="ads-grid">
    </div>

</section>

<script
type="module"
src="admin.js">
</script>

</body>
</html>
